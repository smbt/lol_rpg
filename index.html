<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Modularer RPG Prototyp</title>
</head>

<style type="text/css">
    body {
        font-family: sans-serif;
        background: #222;
        color: #fff;
        margin: 0;
        padding: 0;
    }

    .game-container {
        position: relative;
        width: 800px;
        height: 600px;
        margin: 0;
    }

    canvas {
        border-right: 4px solid #444;
        border-bottom: 4px solid #444;
        background: #443b1a;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    /* Das UI-Layer spannt sich nun über das exakt gesamte Canvas */
    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 800px;
        /* Gleiche Breite wie das Canvas */
        height: 600px;
        /* Gleiche Höhe wie das Canvas */
        pointer-events: none;

        /* Aktiviert Flexbox, um Inhalte unten mittig zu platzieren */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        /* Drückt die Balken nach unten */
        align-items: center;
        /* Zentriert die Balken horizontal */
        padding-bottom: 20px;
        /* Abstand zum unteren Spielfeldrand */
        box-sizing: border-box;
        /* Verhindert, dass das Padding das Layer vergrößert */
        gap: 6px;
        /* Abstand zwischen HP- und EP-Balken */
    }

    /* Die Balken-Container passen sich jetzt flexibel an */
    .bar-container {
        width: 40%;
        /* Relative Breite (40% des gesamten Canvas) */
        height: 24px;
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #666;
        border-radius: 4px;
        position: relative;
        overflow: hidden;
    }

    .bar-fill {
        height: 100%;
        transition: width 0.2s ease;
    }

    #hp-fill {
        background: #dc2626;
        width: 100%;
        /* Steuert die Füllung des Balkens */
    }

    #ep-fill {
        background: #eab308;
        width: 2%;
        /* Steuert die Füllung des Balkens */
    }

    .bar-text {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        text-shadow: 1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000;
    }
</style>

<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Das neue HTML-UI-Layer mit Statusbalken -->
        <div id="ui-layer">
            <!-- HP Balken -->
            <div class="bar-container">
                <div id="hp-fill" class="bar-fill"></div>
                <div class="bar-text">HP: <span id="ui-hp">25/25</span></div>
            </div>

            <!-- EP Balken -->
            <div class="bar-container">
                <div id="ep-fill" class="bar-fill"></div>
                <div class="bar-text">EP: <span id="ui-ep">1/50</span></div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
