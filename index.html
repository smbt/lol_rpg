<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Modularer RPG Prototyp</title>
</head>

<link rel="stylesheet" href="style.css">
</link>

<body>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Das neue HTML-UI-Layer mit Statusbalken -->
        <div id="ui-layer">
            <!-- HP Balken -->
            <div class="bar-container">
                <div id="hp-fill" class="bar-fill"></div>
                <div class="bar-text">HP: <span id="ui-hp">25/25</span></div>
            </div>

            <!-- EP Balken -->
            <div class="bar-container">
                <div id="ep-fill" class="bar-fill"></div>
                <div class="bar-text">EP: <span id="ui-ep">1/50</span></div>
            </div>
        </div>
    </div>


    <script type="module" src="src/main.js"></script>

</body>

</html>
